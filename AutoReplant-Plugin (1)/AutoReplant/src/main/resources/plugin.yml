name: AutoReplant
version: '${project.version}'
main: me.plugin.autoreplant.AutoReplant
api-version: 1.20
description: Auto replant crops when harvested
author: AutoReplant

commands:
  autoreplant:
    description: AutoReplant main command
    aliases: [ar]
    usage: /autoreplant <toggle|reload|info>
    permission: autoreplant.admin

permissions:
  autoreplant.use:
    description: Allow player to use auto replant feature
    default: true
  autoreplant.toggle:
    description: Allow player to toggle their own auto replant
    default: true
  autoreplant.admin:
    description: Allow admin to reload config and manage plugin
    default: op

# AutoReplant Configuration
# Plugin for auto replanting crops after harvest

# ตั้งค่าทั่วไป
settings:
  # เปิด/ปิด plugin ทั้งหมด
  enabled: true

  # เปิดให้ผู้เล่นสลับ on/off ได้ด้วยตัวเอง
  allow-player-toggle: true

  # ต้องใช้เมล็ดพันธุ์จาก inventory หรือไม่?
  # true = ดึงเมล็ดจาก inventory ของผู้เล่น (จำเป็นต้องมีเมล็ด)
  # false = ปลูกได้เลยโดยไม่ต้องใช้เมล็ด
  require-seeds: true

  # แสดงข้อความแจ้งเตือนเมื่อปลูกคืน?
  show-messages: true

  # ต้องถือเครื่องมือ (มีด, จอบ, มือเปล่า) ถึงจะ auto replant?
  # false = ใช้ได้กับทุกอย่าง
  require-hoe: false

  # เปิด auto replant สำหรับผู้เล่นใหม่โดยอัตโนมัติ?
  default-enabled-for-new-players: true

# พืชที่รองรับ (true = เปิด, false = ปิด)
crops:
  WHEAT: true        # ข้าวสาลี
  CARROTS: true      # แครอท
  POTATOES: true     # มันฝรั่ง
  BEETROOTS: true    # บีทรูท
  NETHER_WART: true  # วอร์ตนรก
  COCOA: true        # โกโก้
  SWEET_BERRY_BUSH: true  # พุ่มเบอร์รี่หวาน
  PITCHER_CROP: true      # พืชเหยือก (1.20+)
  TORCHFLOWER_CROP: true  # ดอกไฟฉาย (1.20+)

# ข้อความ (รองรับ & color codes)
messages:
  replanted: "&aปลูกคืน &e{crop} &aเรียบร้อยแล้ว!"
  no-seeds: "&cไม่มีเมล็ด &e{crop} &cในกระเป๋า ไม่สามารถปลูกคืนได้"
  toggle-on: "&aเปิด Auto Replant แล้ว!"
  toggle-off: "&cปิด Auto Replant แล้ว!"
  no-permission: "&cคุณไม่มีสิทธิ์ใช้คำสั่งนี้"
  reloaded: "&aโหลด config ใหม่แล้ว!"

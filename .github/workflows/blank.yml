name: Build AutoReplant Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Find and Build with Maven
        run: |
          POM=$(find . -name "pom.xml" | head -1)
          DIR=$(dirname "$POM")
          echo "Found pom.xml at: $DIR"
          cd "$DIR"
          mvn clean package -B

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoReplant-Plugin
          path: "**/target/AutoReplant-*.jar"
          retention-days: 30


